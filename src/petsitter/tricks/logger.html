<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Logger</title>
<!-- Traffic Logger's Live page: the last requests as plain HTTP, both hops
     (your tool and petsitter, petsitter and the provider), request then
     response, everything but the content. The content is in the log files. -->
<style>
  :root {
    --bg: #0f0f1a; --panel: #16162a; --panel2: #12122a; --border: #1e2a3a; --text: #c8d6e5;
    --dim: #5a7a8a; --muted: #8a9ab0; --title: #8ab4ff; --ok: #6bff8a; --warn: #f0c96b; --bad: #ff7a7a;
    --sel: #1a2a4d; --req: #8ab4ff; --resp: #6bd6a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  h1 { font-size: 14px; margin: 0; color: var(--title); font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  .sub code { color: var(--muted); }
  button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px;
           font: inherit; font-size: 12px; padding: 3px 12px; cursor: pointer; }
  button:hover { border-color: var(--title); color: var(--text); }
  button.done { color: var(--ok); border-color: #2a5a3a; }
  header #clear { margin-left: auto; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
  .list { border-right: 1px solid var(--border); overflow-y: auto; }
  .req { padding: 8px 14px; border-bottom: 1px solid #141a26; cursor: pointer; }
  .req:hover { background: #1a1a33; }
  .req.sel { background: var(--sel); }
  .req .top { display: flex; gap: 8px; font-size: 12px; color: var(--title); }
  .req .top .t { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  .req .line { font: 12px ui-monospace, "SF Mono", Consolas, monospace; color: var(--muted);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .req .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
  .tag.stream { color: var(--ok); border-color: #2a5a3a; }
  .tag.pending { color: var(--warn); border-color: #5a4a2a; }
  .tag.bad { color: var(--bad); border-color: #6a2a2a; }
  .detail { overflow-y: auto; padding: 14px 20px 40px; }
  .empty { color: var(--dim); padding: 40px 20px; max-width: 560px; line-height: 1.6; }
  .empty b { color: var(--text); }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar b { color: var(--text); font-weight: 600; }
  .bar button { margin-left: auto; }
  .kind { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 4px; }
  .kind span { font-size: 13px; font-weight: 700; letter-spacing: .1em; }
  .kind.request span { color: var(--req); }
  .kind.response span { color: var(--resp); }
  .kind small { color: var(--dim); font-size: 12px; }
  pre { margin: 0; padding: 10px 12px; background: #0b0f1a; border: 1px solid var(--border); border-left: 3px solid var(--req);
        border-radius: 4px; font: 12.5px/1.5 ui-monospace, "SF Mono", Consolas, monospace; color: var(--text);
        white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.response { border-left-color: var(--resp); }
  pre.bad { border-left-color: var(--bad); }
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: #0f0f23; border-left: 1px solid #1e2a3a; }
  ::-webkit-scrollbar-thumb { background: #34465a; border-radius: 7px; border: 2px solid #0f0f23; border-left-width: 3px; min-height: 40px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a6a8a; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-color: #34465a #0f0f23; } }
  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .list { max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Traffic Logger</h1>
  <span class="sub" id="sub">The last 40 requests as HTTP, without the content, which is in the log files.</span>
  <button id="clear">clear</button>
</header>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
</div>
<script>
let requests = [], selected = null, folder = "";

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function when(t) { return new Date(t * 1000).toLocaleTimeString(); }

async function act(body) {
  const r = await fetch("action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}

async function load() {
  const d = await act({action: "requests"});
  requests = d.requests || [];
  folder = d.folder || "";
  if (folder) document.getElementById("sub").innerHTML =
    `The last 40 requests as HTTP, without the content, which is in <code>${esc(folder)}</code>.`;
  if (!requests.find(r => r.id === selected)) selected = requests.length ? requests[0].id : null;
  renderList();
  renderDetail();
}

function firstLine(text) { return (text || "").split("\n")[0]; }

function statusTag(r) {
  const h = r.http || {};
  const last = (h.upstream || []).slice(-1)[0];
  const status = last ? last.status : h.client_status;
  if (status === undefined || status === null) {
    if (last && last.error) return '<span class="tag bad">no response</span>';
    return h.done ? "" : '<span class="tag pending">waiting</span>';
  }
  return `<span class="tag${status >= 400 ? " bad" : ""}">HTTP ${status}</span>`;
}

function renderList() {
  document.getElementById("list").innerHTML = requests.map(r =>
    `<div class="req${r.id === selected ? " sel" : ""}" data-id="${esc(r.id)}">` +
    `<div class="top"><span>${esc(r.program || "unknown program")}</span><span class="t">${when(r.at)}</span></div>` +
    `<div class="line">${esc(firstLine((r.http || {}).client_request))}</div>` +
    `<div class="tags">${r.model ? `<span class="tag">${esc(r.model)}</span>` : ""}` +
    `${r.stream ? '<span class="tag stream">stream</span>' : '<span class="tag">no stream</span>'}` +
    `<span class="tag">${esc(r.api)}</span>${statusTag(r)}</div></div>`).join("");
  document.querySelectorAll(".req").forEach(el => el.onclick = () => { selected = el.dataset.id; renderList(); renderDetail(); });
}

// The whole exchange in order: what was sent, what came back, for each hop.
function sections(r) {
  const h = r.http || {};
  const out = [["REQUEST", "your tool → petsitter", h.client_request || "", "request"]];
  (h.upstream || []).forEach((u, i, all) => {
    const n = all.length > 1 ? ` (call ${i + 1} of ${all.length})` : "";
    const timing = u.ms !== undefined && u.ms !== null
      ? ` · ${u.first_byte_ms !== undefined && u.first_byte_ms !== null ? `first byte ${u.first_byte_ms} ms, ` : ""}${u.ms} ms` : "";
    out.push(["REQUEST", `petsitter → provider${n}`, u.request, "request"]);
    out.push(["RESPONSE", `provider → petsitter${n}${timing}`, u.response,
              "response" + (u.status === null || u.status === undefined || u.status >= 400 ? " bad" : "")]);
  });
  out.push(["RESPONSE", "petsitter → your tool", h.client_response ?? "(not sent yet)",
            "response" + (h.client_status >= 400 ? " bad" : "")]);
  return out;
}

function renderDetail() {
  const el = document.getElementById("detail");
  const r = requests.find(x => x.id === selected);
  if (!r) {
    el.innerHTML = '<div class="empty"><b>No requests yet.</b><br><br>Use your AI tool as normal (or send a message ' +
      'from <b>Try it</b>) and each request shows up here as HTTP: what your tool sent and got back, and what ' +
      'petsitter sent the provider and got back.</div>';
    return;
  }
  const parts = sections(r);
  el.innerHTML =
    `<div class="bar"><b>${esc(r.program || "unknown program")}</b><span>${esc(r.model)}</span>` +
    `<span>${esc(r.channel)}</span><span>${esc(r.api)}</span><span>${esc(r.from)}</span>` +
    `<span>${new Date(r.at * 1000).toLocaleString()}</span><span>id ${esc(r.id)}</span>` +
    `<button id="copy-all">copy all</button></div>` +
    parts.map(([kind, hop, text, cls]) =>
      `<div class="kind ${kind.toLowerCase()}"><span>${kind}</span><small>${esc(hop)}</small></div>` +
      `<pre class="${cls}">${esc(text)}</pre>`).join("");
  document.getElementById("copy-all").onclick = e =>
    copy(e.target, parts.map(([kind, hop, text]) => `=== ${kind}: ${hop} ===\n${text}`).join("\n\n"));
}

async function copy(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    // the page may be framed without clipboard access: select and copy instead
    const ta = Object.assign(document.createElement("textarea"), {value: text});
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "copied"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "copy all"; btn.classList.remove("done"); }, 1500);
}

document.getElementById("clear").onclick = async () => { await act({action: "clear"}); selected = null; load(); };

let pending = null;
const source = new EventSource("events");
source.onopen = () => document.getElementById("dot").classList.add("live");
source.onerror = () => document.getElementById("dot").classList.remove("live");
source.onmessage = m => {
  try { if (JSON.parse(m.data).event === "traffic") { clearTimeout(pending); pending = setTimeout(load, 200); } } catch (_) {}
};
// petsitter's own response goes out after the hooks: look again until it has
setInterval(() => { if (requests.some(r => !(r.http || {}).done)) load(); }, 1500);
load();
</script>
</body>
</html>
