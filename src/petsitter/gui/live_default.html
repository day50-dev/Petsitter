<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TRICK_NAME__: live</title>
<!-- The standard Live page: every extension gets it unless it ships its own
     (Trick.ui_page / ui_html). It shows what the extension report()ed, newest
     first. Served at /api/tricks/ui/<id>/, so "events" and "action" are its
     own pipes. -->
<style>
  :root {
    --bg: #0f0f1a; --panel: #16162a; --border: #1e2a3a; --text: #c8d6e5;
    --dim: #5a7a8a; --title: #8ab4ff; --ok: #6bff8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 16px; flex-wrap: wrap;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  h1 { font-size: 14px; margin: 0; color: var(--title); font-weight: 600; }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { color: var(--text); font-size: 16px; margin-left: 6px; }
  .spacer { flex: 1; }
  button { background: var(--bg); border: 1px solid var(--border); color: var(--text);
           padding: 4px 12px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--title); }
  ol { list-style: none; margin: 0; padding: 4px 0; }
  li { padding: 8px 16px; border-bottom: 1px solid #141a26; }
  .row { display: flex; gap: 12px; align-items: baseline; }
  .t { color: var(--dim); font-size: 12px; min-width: 64px; flex: none; font-variant-numeric: tabular-nums; }
  .msg { flex: 1; min-width: 0; }
  .x { color: var(--dim); font-size: 12px; margin-left: 6px; }
  details { margin: 4px 0 0 76px; }
  summary { color: var(--dim); font-size: 12px; cursor: pointer; }
  summary:hover { color: var(--title); }
  pre { margin: 6px 0 0; padding: 8px 10px; background: #12122a; border: 1px solid var(--border);
        border-radius: 5px; font: 12px ui-monospace, "SF Mono", Consolas, monospace;
        white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .empty { padding: 40px 16px; color: var(--dim); max-width: 560px; line-height: 1.6; }
  .empty b { color: var(--text); }
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: #0f0f23; border-left: 1px solid #1e2a3a; }
  ::-webkit-scrollbar-thumb { background: #34465a; border-radius: 7px; border: 2px solid #0f0f23; border-left-width: 3px; min-height: 40px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a6a8a; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-color: #34465a #0f0f23; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>__TRICK_NAME__</h1>
  <span class="stat">times it did something<b id="count">0</b></span>
  <span class="stat" id="last"></span>
  <span class="spacer"></span>
  <button id="clear">clear</button>
</header>
<ol id="log"></ol>
<script>
const log = document.getElementById("log");
let rows = [];   // newest last; identical consecutive reports fold into one row

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function when(ts) {
  return ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";
}

function render() {
  const total = rows.reduce((n, r) => n + r.times, 0);
  document.getElementById("count").textContent = total;
  document.getElementById("last").textContent = rows.length ? "last at " + when(rows[rows.length - 1].ts) : "";
  if (!rows.length) {
    log.innerHTML = '<div class="empty"><b>Nothing yet.</b><br><br>Every time __TRICK_NAME__ does something, '
      + 'it shows up here. Use your AI tool as normal, or send a message from <b>Try it</b>.'
      + '<br><br>Some extensions don&rsquo;t report what they do yet; for those this stays empty even while they work.</div>';
    return;
  }
  log.innerHTML = rows.slice().reverse().map(r =>
    `<li><div class="row"><span class="t">${when(r.ts)}</span><span class="msg">${esc(r.message)}`
    + (r.times > 1 ? `<span class="x">&times;${r.times}</span>` : "") + `</span></div>`
    + (r.details ? `<details><summary>details</summary><pre>${esc(JSON.stringify(r.details, null, 2))}</pre></details>` : "")
    + `</li>`).join("");
}

function add(e) {
  if (!e || e.event !== "report") return;
  const last = rows[rows.length - 1];
  const same = last && last.message === e.message && JSON.stringify(last.details) === JSON.stringify(e.details || null);
  if (same) { last.times++; last.ts = e.ts; }
  else rows.push({message: e.message, details: e.details || null, ts: e.ts, times: 1});
  if (rows.length > 500) rows.splice(0, rows.length - 500);
}

document.getElementById("clear").addEventListener("click", () => {
  fetch("action", {method: "POST", headers: {"Content-Type": "application/json"},
                   body: JSON.stringify({action: "clear"})}).catch(() => {});
  rows = []; render();
});

const source = new EventSource("events");
source.onopen = () => document.getElementById("dot").classList.add("live");
source.onerror = () => document.getElementById("dot").classList.remove("live");
source.onmessage = m => { add(JSON.parse(m.data)); render(); };
render();
</script>
</body>
</html>
