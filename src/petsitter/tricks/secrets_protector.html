<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secrets Protector: live</title>
<!-- Secrets Protector's Live page. Events carry the kind of secret and the
     stand-in the model saw, never the real value. -->
<style>
  :root {
    --bg: #0f0f1a; --panel: #16162a; --border: #1e2a3a; --text: #c8d6e5;
    --dim: #5a7a8a; --title: #8ab4ff; --hid: #f5c542; --back: #6bff8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 22px; padding: 12px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--back); box-shadow: 0 0 6px var(--back); }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { font-size: 18px; margin-left: 6px; }
  .stat.hid b { color: var(--hid); }
  .stat.back b { color: var(--back); }
  .spacer { flex: 1; }
  button { background: var(--bg); border: 1px solid var(--border); color: var(--text);
           padding: 4px 12px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--title); }
  .explain { padding: 10px 16px; color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--border); }
  .explain b { color: var(--text); font-weight: 600; }
  ol { list-style: none; margin: 0; padding: 6px 0; }
  li { display: flex; gap: 12px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid #141a26; }
  .t { color: var(--dim); font-size: 12px; min-width: 64px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 9px; white-space: nowrap; }
  .badge.hid { color: #0f0f1a; background: var(--hid); }
  .badge.back { color: #0f0f1a; background: var(--back); }
  .what { flex: 1; min-width: 0; }
  code { font: 12px ui-monospace, "SF Mono", Consolas, monospace; color: var(--title);
         background: #1a1a33; padding: 1px 6px; border-radius: 4px; }
  .empty { padding: 40px 16px; color: var(--dim); max-width: 560px; line-height: 1.6; }
  .empty code { color: #f5c542; }

/* scrollbars match the petsitter dashboard's */
::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: #0f0f23; border-left: 1px solid #1e2a3a; }
::-webkit-scrollbar-thumb { background: #34465a; border-radius: 7px; border: 2px solid #0f0f23; border-left-width: 3px; min-height: 40px; }
::-webkit-scrollbar-thumb:hover { background: #4a6a8a; }
::-webkit-scrollbar-corner { background: #0f0f23; }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-color: #34465a #0f0f23; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="stat hid">hidden from the model<b id="n-hid">0</b></span>
  <span class="stat back">put back for you<b id="n-back">0</b></span>
  <span class="spacer"></span>
  <button id="clear">clear</button>
</header>
<div class="explain">The model only ever sees the <b>stand-ins</b> below. The real values stay on this machine and are put back in replies and tool calls.</div>
<ol id="log"></ol>
<script>
const log = document.getElementById("log");
let hid = 0, back = 0, rows = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function short(s) { return s.length > 26 ? s.slice(0, 24) + "…" : s; }
function when(ts) {
  return ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";
}

function render() {
  document.getElementById("n-hid").textContent = hid;
  document.getElementById("n-back").textContent = back;
  if (!rows.length) {
    log.innerHTML = '<div class="empty">Nothing hidden yet.<br><br>Send a message that contains an API key, '
      + 'an email address or a phone number, or mark anything yourself with '
      + '<code>(secret: hunter2)</code>. It shows up here the moment it is swapped out.</div>';
    return;
  }
  log.innerHTML = rows.slice().reverse().map(r => r).join("");
}

function add(e) {
  if (e.event === "hidden") {
    hid++;
    rows.push(`<li><span class="t">${when(e.ts)}</span><span class="badge hid">hidden</span>`
      + `<span class="what">Hid ${esc(e.label || e.kind)}. The model sees <code title="${esc(e.stand_in)}">${esc(short(e.stand_in))}</code></span></li>`);
  } else if (e.event === "restored") {
    const n = (e.stand_ins || []).length;
    back += n;
    rows.push(`<li><span class="t">${when(e.ts)}</span><span class="badge back">put back</span>`
      + `<span class="what">${n} real value${n === 1 ? "" : "s"} restored in ${esc(e.where)}: `
      + (e.stand_ins || []).map(s => `<code title="${esc(s)}">${esc(short(s))}</code>`).join(" ") + `</span></li>`);
  }
  if (rows.length > 500) rows.splice(0, rows.length - 500);
}

document.getElementById("clear").addEventListener("click", () => {
  fetch("action", {method: "POST", headers: {"Content-Type": "application/json"},
                   body: JSON.stringify({action: "clear"})}).catch(() => {});
  hid = 0; back = 0; rows = []; render();
});

const source = new EventSource("events");
source.onopen = () => document.getElementById("dot").classList.add("live");
source.onerror = () => document.getElementById("dot").classList.remove("live");
source.onmessage = m => { add(JSON.parse(m.data)); render(); };
render();
</script>
</body>
</html>
